<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Sign Up - TVET Parking System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f0f4ff, #e8edf5);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0,245,255,0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 30px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #1a1a2e; margin-bottom: 20px; }
        label { display: block; margin: 10px 0 5px; color: #1a1a2e; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff00cc, #00f5ff);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { transform: scale(1.02); }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .login-link { text-align: center; margin-top: 15px; }
        .login-link a { color: #00b4d8; text-decoration: none; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        .staff-details {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            grid-column: span 2;
        }
        .staff-details h4 { color: #ff00cc; margin-bottom: 10px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } .staff-details { grid-column: span 1; } }
    </style>
</head>
<body>
<div class="glass">
    <h2>Lecturer Registration</h2>
    <div id="errorMsg" class="error"></div>
    <form id="signupForm">
        <div class="form-grid">
            <div class="full-width">
                <label>Full Name</label>
                <input type="text" id="fullname" placeholder="Dr. Ahmad Bin Abdullah" required>
            </div>
            <div>
                <label>Staff ID (6 digits)</label>
                <input type="text" id="staff_id" placeholder="123456" maxlength="6" required>
            </div>
            <div>
                <label>Email</label>
                <input type="email" id="email" placeholder="lecturer@tvetmara.edu.my" required>
            </div>
            <div>
                <label>Phone Number</label>
                <input type="text" id="phone_no" placeholder="012-3456789" required>
            </div>
            <div>
                <label>Program</label>
                <select id="program" required>
                    <option value="">Select Program</option>
                    <option value="ITW">ITW</option><option value="DFD">DFD</option>
                    <option value="DNS">DNS</option><option value="DTB">DTB</option>
                    <option value="DCP">DCP</option><option value="DCS">DCS</option>
                    <option value="DGA">DGA</option><option value="DCB">DCB</option>
                    <option value="DTF">DTF</option><option value="DTW">DTW</option>
                    <option value="SBN">SBN</option><option value="SLR">SLR</option>
                    <option value="SSB">SSB</option><option value="STF">STF</option>
                </select>
            </div>
            <div class="staff-details">
                <h4>Vehicle Details (Optional)</h4>
                <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                    <div>
                        <label>Plate Number</label>
                        <input type="text" id="plate_no" placeholder="ABC1234" style="text-transform: uppercase;">
                    </div>
                    <div>
                        <label>Vehicle Type</label>
                        <input type="text" id="vehicle_type" placeholder="e.g., Myvi, Vios">
                    </div>
                    <div class="full-width">
                        <label>Vehicle Color</label>
                        <input type="text" id="vehicle_color" placeholder="e.g., White, Red, Black">
                    </div>
                </div>
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password (min 6 chars)" required>
            </div>
            <div>
                <label>Confirm Password</label>
                <input type="password" id="confirm_password" placeholder="Confirm your password" required>
            </div>
        </div>
        <button type="submit">Register & Login</button>
    </form>
    <div class="login-link">Already have an account? <a href="lecturer_login.html">Login here</a></div>
    <a href="index.html" class="back-link">Back to Home</a>
</div>
<script>
const API_URL = 'https://savers-api.lilylorraineee.workers.dev';

document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    let fullname = document.getElementById('fullname').value.trim();
    let staff_id = document.getElementById('staff_id').value.trim();
    let email = document.getElementById('email').value.trim();
    let phone_no = document.getElementById('phone_no').value.trim();
    let program = document.getElementById('program').value;
    let plate_no = document.getElementById('plate_no').value.trim().toUpperCase();
    let vehicle_type = document.getElementById('vehicle_type').value.trim();
    let vehicle_color = document.getElementById('vehicle_color').value.trim();
    let password = document.getElementById('password').value;
    let confirm_password = document.getElementById('confirm_password').value;
    let errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    if (!fullname || !staff_id || !email || !phone_no || !program || !password || !confirm_password) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Please fill in all required fields';
        return;
    }
    if (!/^\d{6}$/.test(staff_id)) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Staff ID must be exactly 6 digits';
        return;
    }
    if (password !== confirm_password) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Passwords do not match';
        return;
    }
    if (password.length < 6) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Password must be at least 6 characters';
        return;
    }

    // Save to localStorage for now (since Worker doesn't have lecturer table yet)
    let lecturers = JSON.parse(localStorage.getItem('lecturers')) || [];
    if (lecturers.some(l => l.email === email)) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Email already registered. Please login.';
        return;
    }
    if (lecturers.some(l => l.staff_id === staff_id)) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Staff ID already registered';
        return;
    }

    let newLecturer = {
        id: Date.now(),
        name: fullname,
        staff_id: staff_id,
        email: email,
        phone_no: phone_no,
        program: program,
        plate_no: plate_no || '',
        vehicle_type: vehicle_type || '',
        vehicle_color: vehicle_color || '',
        password: password
    };
    lecturers.push(newLecturer);
    localStorage.setItem('lecturers', JSON.stringify(lecturers));
    sessionStorage.setItem('loggedInLecturer', JSON.stringify(newLecturer));
    window.location.href = 'lecturer_dashboard.html';
});
</script>
</body>
</html>
